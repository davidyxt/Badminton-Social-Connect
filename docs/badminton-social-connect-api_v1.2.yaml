components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase session JWT for the signed-in player (or service-role JWT for server-only
        calls). Row Level Security policies are the actual authorisation boundary — a request is only
        ever as permissive as the policies allow.
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Supabase project anon (or service_role, server-only) API key, sent alongside the bearer
        token on every request.
  parameters:
    selectParam:
      name: select
      in: query
      required: false
      schema:
        type: string
      description: PostgREST column projection, e.g. select=playerId,displayName. Defaults to all columns.
    orderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: PostgREST ordering, e.g. order=joinedAt.desc.
    limitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
      description: Maximum rows to return (pagination).
    offsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
      description: Rows to skip (pagination); prefer Range header for large lists per PostgREST convention.
    preferParam:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        default: return=representation
      description: Set to return=representation to get the affected row(s) back in the response body.
    player_playerIdFilter:
      name: playerId
      in: query
      required: false
      schema:
        type: string
      description: PostgREST filter on playerId, e.g. playerId=eq.<value>. Required (for every primary-key
        column) on PATCH/DELETE to target specific row(s).
    player_profile_playerIdFilter:
      name: playerId
      in: query
      required: false
      schema:
        type: string
      description: PostgREST filter on playerId, e.g. playerId=eq.<value>. Required (for every primary-key
        column) on PATCH/DELETE to target specific row(s).
    notification_notificationIdFilter:
      name: notificationId
      in: query
      required: false
      schema:
        type: string
