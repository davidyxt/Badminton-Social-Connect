components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase session JWT for the signed-in player (or service-role JWT for server-only calls). Row
        Level Security policies are the actual authorisation boundary — a request is only ever as permissive
        as the policies allow.
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: >-
        Supabase project anon (or service_role, server-only) API key, sent alongside the bearer token
        on every request.
  parameters:
    selectParam:
      name: select
      in: query
      required: false
      schema:
        type: string
      description: PostgREST column projection, e.g. select=post_id,title,club(name).
    orderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: PostgREST ordering, e.g. order=proposed_time.asc.
    limitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
      description: Maximum rows to return (pagination).
    offsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
      description: Rows to skip (pagination); prefer Range header for large lists per PostgREST convention.
    preferParam:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        default: return=representation
      description: Set to return=representation to get the affected row(s) back in the response body.
    rowFilter:
      name: "<column>"
      in: query
      required: false
      schema:
        type: string
      description: >-
        Any PostgREST filter on a column, e.g. post_id=eq.<uuid> or status=in.(open,full). PATCH and DELETE
        must filter to the rows meant (the API refuses an unfiltered update or delete).
  responses:
    Unauthorized:
      description: Not signed in, or the function is not open to signed-out visitors (`42501` permission
        denied).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: Row Level Security refused the write (`42501`).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    RuleBroken:
      description: >-
        A rule was broken. `code` says which kind (`23514` rule, `23505` already done, `22023` invalid
        value, `42501` not allowed); show `message` to the player.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ValidationError:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    AdminPost:
      type: object
      description: >-
        Staff announcements shown in-app. Drafts must never be visible to players; that is enforced by
        the select policy below.
      properties:
        admin_post_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        display_order:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: >-
            The player who last changed this row. Null when the change came from service_role, meaning
            a backend job rather than a person. Set by the admin_post_set_updated_metadata trigger; a
            value sent by a client is ignored. Not a foreign key, so that player embeds stay unambiguous.
    AdminPostWrite:
      type: object
      properties:
        admin_post_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        display_order:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: >-
            The player who last changed this row. Null when the change came from service_role, meaning
            a backend job rather than a person. Set by the admin_post_set_updated_metadata trigger; a
            value sent by a client is ignored. Not a foreign key, so that player embeds stay unambiguous.
      required:
      - created_by
      - title
    Blocks:
      type: object
      description: >-
        Who has blocked whom. Named as in the API spec (/blocks). Only the blocker can see their own rows;
