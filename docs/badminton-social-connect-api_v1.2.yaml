        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
