      tags:
      - Request Game
      summary: 'Request Game: invite one player to a singles game'
      x-implementation: postgres-rpc
      description: |-
        Request Game: invite one player to a singles game. supabase.rpc('invite_player', { p_player_id, p_proposed_time, p_venue_id | p_suburb, p_duration_minutes, p_style, p_ability_level, p_title, p_notes, p_message }) returns the game id. Same fields as Post a Game, for two players. The invited player is notified (match_invite) and answers with accept_invite / decline_invite. Only the two players and admins can see the game. At most 10 unanswered invitations at a time.

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Complete registration first.
        - `23514` (a rule was broken): You cannot invite yourself.
        - `42501` (not allowed): This player is not available.
        - `23514` (a rule was broken): Keep the message under 300 characters.
        - `23514` (a rule was broken): You have 10 invitations waiting for an answer. Wait for some replies, or cancel one, before inviting anyone else.
