# Badminton Social Connect — API Specification (OpenAPI 3.0 / Swagger)
# Generated to match the Technical Design Document's API Specification section.
# Open in https://editor.swagger.io or any OpenAPI 3.0-compatible viewer.
openapi: 3.0.3
info:
  title: Badminton Social Connect API
  version: 0.1.0
  description: 'Badminton Social Connect follows a two-tier approach to backend access. Most screens read
    and write data directly against Supabase''s auto-generated PostgREST APIs (the `Data: *` operations
    below), called through the Supabase client from Next.js Server Components, Server Actions and Route
    Handlers, and from the browser client where realtime updates are needed. Row Level Security (RLS)
    policies on each table are the actual authorisation boundary — a request is only ever as permissive
    as the policies allow, whichever part of the app makes it.


    Operations that need to touch multiple tables atomically, run with elevated privileges, or apply business
    logic that can''t be expressed as a simple insert, update or delete are implemented as Postgres RPC
    functions, called as `POST /rpc/{function}` (the operations grouped under Auth, Game Posts, Results
    & Ranking, Mini Leagues, Trust & Safety and Admin below).


    This mirrors, and should be kept in sync with, the Data Endpoints / Custom Functions / Conventions
    tables in the Technical Design Document''s API Specification section.


    **Implementation key** — every operation below carries an `x-implementation` value, and RPC summaries
    are prefixed to match, so it''s clear at a glance what backs each endpoint:

    - `supabase-postgrest` — a standard, auto-generated Supabase REST endpoint (the `Data: *` operations
    below); no custom code, just a table plus RLS policies.

    - `postgres-rpc` (prefixed `[Postgres RPC]`) — a Postgres function exposed by Supabase through the
    standard `POST /rpc/{function}` REST endpoint; still a standard Supabase API, just business logic
    instead of plain CRUD. This is every RPC below except the two called out next.

    - `edge-function` (prefixed `[Edge Function]`) — a Supabase Edge Function rather than a plain Postgres
    RPC, used only where the Technical Design Document calls for elevated (service_role) privilege across
    tables the caller doesn''t own: `admin_suspend_account` and `admin_restore_account`.


    **Conventions**

    - Authentication and authorisation: every request carries the Supabase session JWT (`bearerAuth`)
    and the project API key (`apiKeyAuth`); RLS policies, not frontend checks, are the actual authorisation
    boundary.

    - Error shape: errors follow the `{code, message}` shape defined in the `Error` schema, aligned with
    the structured `log_type=error` format used for application logging.

    - Idempotency: mutating RPCs that can be retried (result submission, join requests) are written to
    be safe to call twice with the same input.

    - Pagination: list endpoints use PostgREST''s `select` / `order` / `limit` / `offset` query parameters,
    or a `Range` header for large lists, rather than returning full tables.

    - Shared types: run `supabase gen types typescript` after every schema change so the frontend and
    this spec never drift apart — this file is the reference for schema **shape**; the generated TypeScript
    types are the reference for actual client code.

    - Secrets: the Supabase `service_role` key (needed for a handful of admin RPCs) is used only inside
    Edge Functions and server-only code, and is never exposed to the Next.js client bundle.


    **Realtime channels** (not representable as REST paths — documented here for completeness; see `x-realtime-channels`):

    - `notifications:{playerId}` — per player, own row only — live badge/list updates on new or read notifications.

    - `game_post:{postId}` — per open post — live status updates (join requests, full, cancelled).

    - `mini_league:{leagueId}:standings` — per league — leaderboard updates after a confirmed result.

    - `admin:reports` / `admin:activity_log` — admin only — live report queue and activity log.

    '
  contact:
    name: Badminton Social Connect delivery team
servers:
- url: https://<project-ref>.supabase.co/rest/v1
  description: Supabase project REST API (replace <project-ref> with the actual project ref). All table
    and /rpc paths below are relative to this base.
tags:
- name: 'Data: Player'
  description: 'Standard Supabase/PostgREST CRUD for the Player table. POST is typically performed by
    the register_player RPC (which also enforces the minimum-age check) rather than called directly by
    the frontend. Admin status is not a column here — it is held in the Supabase Auth user''s app_metadata
    (see Admin: Sign in and access control) and checked through the is_admin() RLS helper, so it can never
    be changed by a client PATCH.'
- name: 'Data: PlayerProfile'
  description: Standard Supabase/PostgREST CRUD for the PlayerProfile table. Created automatically alongside
    player by register_player (state is captured on the sign-up form and passed through); no direct POST/DELETE.
- name: 'Data: Notification'
  description: Standard Supabase/PostgREST CRUD for the Notification table. Rows are written only by the
    dispatch_notification helper (called from other RPCs); PATCH is limited to isRead by the owning player.
- name: 'Data: Report'
  description: Standard Supabase/PostgREST CRUD for the Report table. A reporter can create and read their
    own reports. Status changes are made by admin_review_report, not a raw PATCH.
- name: 'Data: GamePost'
  description: Standard Supabase/PostgREST CRUD for the GamePost table. organiserId is set from the authenticated
    caller server-side (never client-supplied) on create. PATCH is limited to the organiser. When groupId
    is set, the caller must be a member of that group (checked by RLS). Cancellation should go through
    cancel_game_post so a CancellationRecord is written atomically, and is only allowed at least 4 hours
    before proposedTime (see cancel_game_post below); within that window the post can only lapse via no-shows,
    not organiser cancellation.
- name: 'Data: CancellationRecord'
  description: Standard Supabase/PostgREST CRUD for the CancellationRecord table. System-managed; written
    only by cancel_game_post.
- name: 'Data: Ranking'
  description: Standard Supabase/PostgREST CRUD for the Ranking table. Public leaderboard, read-only;
    updated only by confirm_result / record_league_match.
- name: 'Data: MiniLeague'
  description: Standard Supabase/PostgREST CRUD for the MiniLeague table. POST creates the league (caller
    becomes organiser; organiserId is set server-side, never client-supplied). Admin suspend/resume goes
    through admin_suspend_league / admin_resume_league.
- name: 'Data: LeagueStanding'
  description: Standard Supabase/PostgREST CRUD for the LeagueStanding table. Read-only; a row is inserted
    by join_mini_league and recalculated by record_league_match.
- name: 'Data: Group'
  description: Standard Supabase/PostgREST CRUD for the Group table. POST registers the group (caller
    becomes createdBy, set server-side). PATCH (name only) is limited to createdBy. A player posts a game
    on behalf of a group by setting game_post.groupId; RLS requires the caller be a GroupMember of that
    group.
- name: 'Data: GroupMember'
  description: Standard Supabase/PostgREST CRUD for the GroupMember table. A player joins a group by inserting
    their own row (self-service, no approval step in this MVP) and leaves by deleting it. Read is limited
    to a group's own members plus the group's createdBy.
- name: 'Data: Venue'
  description: Standard Supabase/PostgREST CRUD for the Venue table. «CouldHave» — read-only for players;
    create/update restricted to admin or a verified organiser by RLS.
- name: 'Data: Match'
  description: Standard Supabase/PostgREST CRUD for the Match table. Created by accept_request; results
    are written only through submit_result / confirm_result, never a raw PATCH.
- name: 'Data: CheckIn'
  description: Standard Supabase/PostgREST CRUD for the CheckIn table. «CouldHave» — a player checks themself
    in directly.
- name: 'Data: MatchParticipant'
  description: Standard Supabase/PostgREST CRUD for the MatchParticipant table. System-managed join table,
    written by request_to_join / accept_request / decline_request / withdraw_request / mark_no_show.
- name: 'Data: MatchResult'
  description: Standard Supabase/PostgREST CRUD for the MatchResult table. Read-only via REST; submission
    and confirmation go through submit_result / confirm_result so ranking and league standing updates
    stay atomic.
- name: 'Data: MatchMessage'
  description: Standard Supabase/PostgREST CRUD for the MatchMessage table. Create-and-read only, no update/delete.
    Limited to the two match participants (senderId set from the caller server-side). Delivered live over
    the match:{matchId}:messages Realtime channel.
- name: 'Data: Dispute'
  description: Standard Supabase/PostgREST CRUD for the Dispute table. A participant can raise and read
    their own disputes. Resolution goes through resolve_dispute (admin only).
- name: 'Data: Block'
  description: Standard Supabase/PostgREST CRUD for the Block table. Owner-only. Find Games and league
    membership queries exclude blocked pairs.
- name: 'Data: ActivityLog'
  description: Standard Supabase/PostgREST CRUD for the ActivityLog table. Written only by admin-action
    RPCs; readable only by admin.
- name: 'Data: AdminPost'
  description: 'Standard Supabase/PostgREST CRUD for the AdminPost table. Admin-only create/update/delete,
    gated by the same is_admin() RLS helper used everywhere else in the admin console (see Admin: Sign
    in and access control); createdBy set server-side. GET is open to every signed-in player but RLS restricts
    it to status=published rows; admins additionally see their own drafts. Shown on the player home page
    and mirrored on an admin management page.'
- name: Auth
  description: Account creation and onboarding.
- name: Game Posts
  description: Creating, joining and cancelling one-off games.
- name: Results & Ranking
  description: Submitting and confirming match results, disputes, and the ranking recalculation they trigger.
- name: Admin
  description: 'Admin-only moderation actions: suspend/restore accounts, hide/restore posts, suspend/resume
    leagues, review reports, resolve disputes.'
- name: Trust & Safety
  description: Reporting and blocking other players, posts or leagues.
- name: Mini Leagues
  description: Creating and joining Mini Leagues, and recording league matches.
