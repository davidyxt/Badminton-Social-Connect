  "/rpc/cancel_game_post":
    post:
      operationId: cancel_game_post
      tags:
      - Games
      summary: Organiser or group admin cancels an upcoming game
      x-implementation: postgres-rpc
      description: |-
        Organiser or group admin cancels an upcoming game: supabase.rpc('cancel_game_post', { p_post_id, p_reason }). Refused within 4 hours of the start (admins excepted) and once the game has started. Writes cancellation_record and notifies players. The post stays visible as cancelled.

