        matchId:
          type: string
          format: uuid
          description: Match this message belongs to (FK to match.matchId).
        senderId:
          type: string
          format: uuid
          description: Player who sent it (FK to player.playerId).
        templateCode:
          type: string
          description: One of a fixed set of preset messages, e.g. on_my_way | running_late_5 | running_late_15
            | cant_make_it | arrived | at_court | waiting_front_desk | thanks_for_game | rematch. No free
            text — this is the light preset-message feature, not open chat.
        sentAt:
          type: string
          format: date-time
          description: When the message was sent.
      required:
      - messageId
    MatchMessageCreate:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
