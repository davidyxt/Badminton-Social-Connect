  "/rpc/register_player":
    post:
      operationId: register_player
      tags:
      - Registration
      summary: Completes the 18+ age gate after sign-up (Google sign-ins always need it)
      x-implementation: postgres-rpc
      description: |-
        Completes the 18+ age gate after sign-up (Google sign-ins always need it): supabase.rpc('register_player', { p_date_of_birth, p_age_declared, p_terms_version, p_privacy_version, p_state, p_username }). p_username is required when the account has none yet (Google), optional otherwise. Errors carry a message safe to show.

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Sign in first.
        - `23505` (already done / taken): This account has already completed registration.
        - `23514` (a rule was broken): Choose a username.
        - `22023` (invalid value): Usernames are 3-20 letters, numbers, _ or .
        - `23505` (already done / taken): That username is taken.
        - `22023` (invalid value): Choose your state or territory.
        - `22023` (invalid value): Enter a valid date of birth.
        - `23514` (a rule was broken): You must be 18 or over to use Badminton Social Connect.
        - `23514` (a rule was broken): Please confirm that you are 18 or over.
        - `23514` (a rule was broken): Please accept the terms of use and the privacy notice.
      responses:
        '204':
          description: Done. No body.
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_date_of_birth:
                  type: string
                  format: date
                p_age_declared:
                  type: boolean
                p_terms_version:
                  type: string
                p_privacy_version:
                  type: string
                p_state:
                  type: string
                p_username:
                  type: string
              required:
              - p_date_of_birth
              - p_age_declared
              - p_terms_version
              - p_privacy_version
              - p_state
