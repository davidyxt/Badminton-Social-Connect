# Badminton Social Connect — API specification (OpenAPI 3.0)
# Built by supabase/scripts/build_openapi.py from the running local stack. Do not edit by
# hand: change the function COMMENT or the script, then run it again.
# Open in https://editor.swagger.io or any OpenAPI 3.0 viewer.
openapi: 3.0.3
info:
  title: Badminton Social Connect API
  version: 0.3.0
  description: |
    How the frontend talks to the backend. Everything goes through the Supabase client:

    - **Tables** (`GET/POST/PATCH/DELETE /{table}`): `supabase.from('game_post').select(...)` and so on. Row
      Level Security is the authorisation boundary: a request can only see or change the rows its policies
      allow, so a refused PATCH or DELETE often returns an empty list rather than an error. Column names are
      the database's snake_case names.
    - **Functions** (`POST /rpc/{name}`): `supabase.rpc('search_games', { p_query, ... })`. Parameters start
      with `p_`. Screen functions return camelCase JSON shaped for the screen, e.g. `get_game_details`
      returns what the Game Details page renders.

    Version 0.3.0 (2026-10-08) is built from the running backend by `supabase/scripts/build_openapi.py`:
    every table, column, allowed value and function parameter is what the database has; every response
    schema and example comes from a real call as a dev seed account. Endpoints the original design describes
    but nobody has built yet are tagged **Planned (not built yet)**.

    **Errors.** Every error is `{ code, message, details, hint }`. `code` is the Postgres error code:
    `42501` not allowed, `23514` a rule was broken, `23505` already done or taken, `22023` an invalid value.
    `message` is written for players and can be shown as it is. Each function lists the errors it raises.

    **Signed out.** Only `is_username_available` (for the sign-up form) works before sign-in.

    **Not yet registered.** A player who has not passed the 18+ age gate (`get_my_home().registered` is false)
    sees no other players or games: lists come back empty and details null. Send them to
    `/complete-registration`, which calls `register_player`.

    **Realtime.** New notifications arrive over Supabase Realtime (`postgres_changes` on `public.notification`);
    see `x-realtime-channels`.
  contact:
    name: Badminton Social Connect delivery team
servers:
- url: https://<project-ref>.supabase.co/rest/v1
  description: >-
    Supabase project REST API (replace <project-ref> with the actual project ref). All table and /rpc
    paths below are relative to this base.
tags:
- name: Registration
  description: >-
    Sign-up checks, the 18+ age gate (BL-007) and account deletion. Sign-up, sign-in, Google and password
    reset themselves go through supabase.auth, not this API.
- name: Profile
  description: 'The signed-in player''s own data: Home page, Profile page and its settings screens.'
- name: Find games
  description: Post a Game form data, Find Games search and Game Details (BL-013, BL-015).
- name: Join requests
  description: Asking to join a game and the organiser's responses (BL-017).
- name: Games
  description: Cancelling and removing games, and the game tables (BL-013, BL-016).
- name: Players
  description: 'Other players: search, profiles, playing history (BL-019, BL-060).'
- name: Trust and safety
  description: Blocking (one-sided, BL-027) and reporting (BL-028).
- name: Notifications
  description: >-
    In-app notifications (BL-050). New rows also arrive over Realtime: subscribe to postgres_changes on
    public.notification; RLS sends each player only their own.
- name: Reliability
  description: No-shows and the reliability score (BL-052, BL-054).
- name: Clubs
  description: Clubs, their admins and members (BL-080). Players join by asking; a club admin approves.
- name: Results (tables)
  description: >-
    Matches, results, disputes and check-ins. Result submission and confirmation screens are not built
    in the backend yet (Planned).
- name: Rankings and leagues (tables)
  description: Read access to rankings and Mini Leagues. Their calculations and league management are
    Planned.
- name: Announcements
  description: Admin posts shown on the home page.
- name: Reference data
  description: States, suburbs and venues. Venues carry a Google Maps link (maps_url).
- name: Admin
  description: Platform admin actions (app_metadata.role = admin).
- name: Internal
  description: Called by Edge Functions with the service role, never by the app.
- name: Planned (not built yet)
  description: >-
    From the original design. Kept so the team can see what is still to build; the parameters may change
    when they are built.
