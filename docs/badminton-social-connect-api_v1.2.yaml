  "/rpc/request_to_join":
    post:
      operationId: request_to_join
      tags:
      - Join requests
      summary: Ask to join a game, with an optional note to the host (max 300 chars)
      x-implementation: postgres-rpc
      description: |-
        Ask to join a game, with an optional note to the host (max 300 chars): supabase.rpc('request_to_join', { p_post_id, p_message }). A withdrawn request can be made again; a declined one cannot.

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Complete registration first.
        - `42501` (not allowed): Game not found.
        - `23514` (a rule was broken): You organise this game.
        - `23514` (a rule was broken): You were invited to this game: answer with accept_invite or decline_invite.
        - `23505` (already done / taken): You have already asked to join this game.
        - `23514` (a rule was broken): The organiser has declined your request for this game.
      responses:
        '204':
          description: Done. No body.
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_post_id:
                  type: string
                  format: uuid
                p_message:
                  type: string
              required:
              - p_post_id
  "/rpc/withdraw_request":
    post:
      operationId: withdraw_request
      tags:
      - Join requests
      summary: A player withdraws their request or their accepted place
      x-implementation: postgres-rpc
      description: |-
        A player withdraws their request or their accepted place: supabase.rpc('withdraw_request', { p_post_id }). Allowed until the start. Giving up an accepted place within 24 hours of the start is a late withdrawal and lowers reliability (BL-054).

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Complete registration first.
        - `23514` (a rule was broken): Organisers cancel the game instead.
        - `42501` (not allowed): You have no request or place in this game.
      responses:
        '204':
          description: Done. No body.
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_post_id:
                  type: string
                  format: uuid
              required:
              - p_post_id
