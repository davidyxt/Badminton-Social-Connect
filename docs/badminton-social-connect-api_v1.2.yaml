  "/rpc/cancel_game_post":
    post:
      operationId: cancel_game_post
      tags:
      - Games
      summary: Organiser or club admin cancels an upcoming game
      x-implementation: postgres-rpc
      description: |-
        Organiser or club admin cancels an upcoming game: supabase.rpc('cancel_game_post', { p_post_id, p_reason }). Refused within 4 hours of the start (admins excepted) and once the game has started. Writes cancellation_record and notifies players. The post stays visible as cancelled.

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Complete registration first.
        - `42501` (not allowed): Game not found, or you do not organise it.
        - `23505` (already done / taken): This game is already cancelled.
        - `23514` (a rule was broken): This game has already started or finished, so it cannot be cancelled. Mark no-shows instead.
        - `23514` (a rule was broken): Games cannot be cancelled within 4 hours of the start time. Mark no-shows afterwards instead.
      responses:
        '204':
          description: Done. No body.
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_post_id:
                  type: string
                  format: uuid
                p_reason:
                  type: string
              required:
              - p_post_id
  "/rpc/delete_game_post":
    post:
      operationId: delete_game_post
      tags:
      - Games
      summary: Organiser or club admin deletes a game that has not happened
      x-implementation: postgres-rpc
      description: |-
        Organiser or club admin deletes a game that has not happened: supabase.rpc('delete_game_post', { p_post_id }). The post is hidden, not removed. Subject to the 4-hour rule unless already cancelled. Games that have happened need admin_delete_game_post.

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Complete registration first.
        - `42501` (not allowed): Game not found, or you do not organise it.
        - `42501` (not allowed): This game has already happened, so only an admin can delete it.
        - `23514` (a rule was broken): Games cannot be deleted within 4 hours of the start time.
      responses:
        '204':
          description: Done. No body.
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
