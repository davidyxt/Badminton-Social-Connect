        format:
          type: string
          description: Game format, e.g. singles, doubles.
        suburb:
          type: string
          description: Suburb where the game is proposed.
        proposedTime:
          type: string
          format: date-time
          description: Proposed start time.
        status:
          type: string
          description: open | full | cancelled | closed.
    CancellationRecord:
      type: object
      properties:
        postId:
          type: string
          format: uuid
          description: Game post that was cancelled (PK, FK to game_post.postId).
        cancelledAt:
          type: string
          format: date-time
          description: When the post was cancelled.
        reason:
          type: string
          description: Cancellation reason.
        isNoShow:
          type: boolean
          description: Whether the cancellation followed a no-show.
