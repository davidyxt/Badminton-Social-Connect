  schemas:
    Player:
      type: object
      properties:
        playerId:
          type: string
          format: uuid
          description: Unique player id (matches the Supabase Auth user id).
        displayName:
          type: string
          description: Public display name.
        selfRatingBand:
          type: string
          description: Self-declared skill band at sign-up (e.g. Beginner, Intermediate, Advanced).
        isVerified:
          type: boolean
          description: Whether the player has completed identity/age verification.
        joinedAt:
          type: string
          format: date-time
          description: When the player account was created.
      required:
      - playerId
    PlayerCreate:
      type: object
      properties:
        playerId:
          type: string
          format: uuid
          description: Unique player id (matches the Supabase Auth user id).
        displayName:
          type: string
          description: Public display name.
        selfRatingBand:
          type: string
          description: Self-declared skill band at sign-up (e.g. Beginner, Intermediate, Advanced).
        isVerified:
          type: boolean
          description: Whether the player has completed identity/age verification.
        joinedAt:
          type: string
          format: date-time
          description: When the player account was created.
    PlayerUpdate:
      type: object
      properties:
        displayName:
          type: string
          description: Public display name.
        selfRatingBand:
          type: string
          description: Self-declared skill band at sign-up (e.g. Beginner, Intermediate, Advanced).
        isVerified:
          type: boolean
          description: Whether the player has completed identity/age verification.
        joinedAt:
          type: string
          format: date-time
          description: When the player account was created.
    PlayerProfile:
      type: object
      properties:
        playerId:
          type: string
          format: uuid
          description: Player this profile belongs to (PK, FK to player.playerId).
        bio:
          type: string
          description: Free-text profile bio.
        suburb:
          type: string
          description: Home suburb, used for Find Games matching.
        state:
          type: string
          description: Australian state/territory the player plays in (e.g. VIC, NSW), captured at sign-up.
        reliabilityScore:
          type: number
          format: float
          description: Computed reliability score, 0-1.
        gamesPlayed:
          type: integer
          description: Total verified games played.
        noShowCount:
          type: integer
          description: Total recorded no-shows.
        isDiscoverable:
          type: boolean
          description: Whether other players can find this profile.
      required:
      - playerId
    PlayerProfileUpdate:
      type: object
      properties:
        bio:
          type: string
          description: Free-text profile bio.
        suburb:
          type: string
          description: Home suburb, used for Find Games matching.
        state:
          type: string
          description: Australian state/territory the player plays in (e.g. VIC, NSW), captured at sign-up.
        reliabilityScore:
          type: number
          format: float
          description: Computed reliability score, 0-1.
        gamesPlayed:
          type: integer
          description: Total verified games played.
        noShowCount:
          type: integer
          description: Total recorded no-shows.
        isDiscoverable:
          type: boolean
          description: Whether other players can find this profile.
    Notification:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
          description: Unique notification id.
        playerId:
          type: string
          format: uuid
          description: Recipient player (FK to player.playerId).
        type:
          type: string
          description: Notification type, e.g. join_request, result_pending, dispute_raised.
        message:
          type: string
          description: Rendered notification text.
        isRead:
          type: boolean
          description: Whether the recipient has read this notification.
      required:
      - notificationId
    NotificationUpdate:
      type: object
      properties:
        playerId:
          type: string
          format: uuid
          description: Recipient player (FK to player.playerId).
        type:
          type: string
          description: Notification type, e.g. join_request, result_pending, dispute_raised.
        message:
          type: string
          description: Rendered notification text.
        isRead:
          type: boolean
          description: Whether the recipient has read this notification.
    Report:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
          description: Unique report id.
        reportedByPlayerId:
          type: string
          format: uuid
          description: Player who filed the report (FK).
        targetType:
          type: string
          description: 'What is being reported: player | game_post | mini_league.'
        targetId:
          type: string
          format: uuid
          description: Id of the reported player, game post or mini league. Polymorphic — no single FK
            can reference three different tables, so this is enforced in RLS/RPC logic, not a drawn constraint.
        reason:
          type: string
          description: Reporter-supplied reason.
        status:
          type: string
          description: open | reviewing | resolved | dismissed.
      required:
      - reportId
    ReportCreate:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
          description: Unique report id.
        reportedByPlayerId:
          type: string
          format: uuid
          description: Player who filed the report (FK).
        targetType:
          type: string
          description: 'What is being reported: player | game_post | mini_league.'
        targetId:
          type: string
          format: uuid
          description: Id of the reported player, game post or mini league. Polymorphic — no single FK
            can reference three different tables, so this is enforced in RLS/RPC logic, not a drawn constraint.
        reason:
          type: string
          description: Reporter-supplied reason.
        status:
          type: string
          description: open | reviewing | resolved | dismissed.
    GamePost:
      type: object
      properties:
        postId:
          type: string
          format: uuid
          description: Unique game post id.
        organiserId:
          type: string
          format: uuid
          description: Player who created this post (FK to player.playerId). Set from the caller on create;
            drives the "only the organiser can update or cancel" RLS rule.
        groupId:
          type: string
          format: uuid
          description: Group this post was made on behalf of, if any (FK to group.groupId, nullable).
            Absent/null means the organiser posted it personally rather than as a group.
        format:
          type: string
          description: Game format, e.g. singles, doubles.
        suburb:
          type: string
          description: Suburb where the game is proposed.
        proposedTime:
          type: string
          format: date-time
          description: Proposed start time.
        status:
          type: string
          description: open | full | cancelled | closed.
      required:
      - postId
    GamePostCreate:
      type: object
      properties:
        postId:
          type: string
          format: uuid
          description: Unique game post id.
        groupId:
          type: string
          format: uuid
          description: Group this post was made on behalf of, if any (FK to group.groupId, nullable).
            Absent/null means the organiser posted it personally rather than as a group.
        format:
          type: string
          description: Game format, e.g. singles, doubles.
        suburb:
          type: string
          description: Suburb where the game is proposed.
        proposedTime:
          type: string
          format: date-time
          description: Proposed start time.
        status:
          type: string
          description: open | full | cancelled | closed.
    GamePostUpdate:
      type: object
      properties:
