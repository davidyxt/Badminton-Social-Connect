  "/rpc/search_games":
    post:
      operationId: search_games
      tags:
      - Find games
      summary: 'Find Games: upcoming games, filtered'
      x-implementation: postgres-rpc
      description: >-
        BL-015. Upcoming open or full games, soonest first, as Find Games cards: supabase.rpc('search_games',
        { p_query, p_level, p_format, p_suburb, p_from, p_to, p_limit, p_offset }). Every filter is optional.
        p_query matches title, suburb, venue and level. p_level: beginner | intermediate | advanced (games
        open to any level always match). p_format: singles | doubles. Pages of up to 50.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/GameCard"
              example:
              - id: 00000000-0000-0000-0000-00000000b001
                date: Sun, 11 Oct
