      type: object
      properties:
        id:
          type: string
          format: uuid
        bio:
          type: string
        area:
          type: string
        name:
          type: string
        wins:
          type: integer
        level:
          type: string
        league:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            position:
              type: integer
          nullable: true
        losses:
          type: integer
        rating:
          type: integer
          nullable: true
        status:
          type: string
        matches:
          type: integer
        noShows:
          type: integer
        initials:
          type: string
        isBlocked:
          type: boolean
        isVerified:
          type: boolean
        recentForm:
          type: array
          items:
            type: string
        gamesPlayed:
          type: integer
        reliability:
          type: integer
        lateWithdrawals:
          type: integer
        preferredFormat:
          type: string
        profileImageUrl:
          type: string
          nullable: true
          description: Null in every sample (not built yet).
        reliabilityBand:
          type: string
        lateCancellations:
          type: integer
    HistoryEntry:
      type: object
      properties:
        date:
          type: string
        score:
          type: string
        format:
          type: string
        gameId:
          type: string
          format: uuid
        result:
          type: string
        matchId:
          type: string
          format: uuid
        partner:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            initials:
              type: string
            isBlocked:
              type: boolean
          nullable: true
        location:
          type: string
        playedAt:
          type: string
          format: date-time
        opponents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              initials:
                type: string
              isBlocked:
                type: boolean
    BlockedPlayer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        reason:
          type: string
        category:
          type: string
        initials:
          type: string
        blockedAt:
          type: string
          format: date-time
        categoryLabel:
          type: string
    NotificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        postId:
          type: string
          format: uuid
          nullable: true
        unread:
          type: boolean
        matchId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    DeletionImpact:
      type: object
      properties:
        matches:
          type: integer
        players:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              player_id:
                type: string
                format: uuid
        post_id:
          type: string
          format: uuid
        has_happened:
          type: boolean
        rating_changes:
          type: string
          nullable: true
          description: Null in every sample (not built yet).
        confirmed_results:
          type: integer
    ActivityLog:
      type: object
      properties:
        logId:
          type: string
          format: uuid
          description: Unique log entry id.
        actorId:
          type: string
          format: uuid
          description: Admin (or system) that performed the action.
        action:
          type: string
          description: Action performed, e.g. suspend_account, hide_post.
        targetType:
          type: string
          description: Type of the affected record, e.g. player, game_post, mini_league.
        targetId:
          type: string
          description: Id of the affected record.
        details:
          type: string
          description: Free-text or JSON-encoded detail of the action.
        createdAt:
          type: string
          format: date-time
          description: When the action was logged.
      required:
      - logId
    MatchMessage:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
          description: Unique message id.
        matchId:
          type: string
          format: uuid
          description: Match this message belongs to (FK to match.matchId).
        senderId:
          type: string
          format: uuid
          description: Player who sent it (FK to player.playerId).
        templateCode:
          type: string
          description: >-
            One of a fixed set of preset messages, e.g. on_my_way | running_late_5 | running_late_15 |
            cant_make_it | arrived | at_court | waiting_front_desk | thanks_for_game | rematch. No free
            text — this is the light preset-message feature, not open chat.
        sentAt:
          type: string
          format: date-time
          description: When the message was sent.
      required:
      - messageId
    MatchMessageCreate:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
          description: Unique message id.
        matchId:
          type: string
          format: uuid
          description: Match this message belongs to (FK to match.matchId).
        templateCode:
          type: string
          description: >-
            One of a fixed set of preset messages, e.g. on_my_way | running_late_5 | running_late_15 |
            cant_make_it | arrived | at_court | waiting_front_desk | thanks_for_game | rematch. No free
            text — this is the light preset-message feature, not open chat.
        sentAt:
          type: string
          format: date-time
          description: When the message was sent.
    Error:
      type: object
      description: PostgREST error. `code` is the Postgres error code; `message` is written to be shown
        to players.
      properties:
        code:
          type: string
          example: '23514'
        message:
          type: string
          example: Games cannot be cancelled within 4 hours of the start time.
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
      required:
      - code
      - message
x-realtime-channels:
- channel: postgres_changes on public.notification
  status: built
  scope: Own rows only (RLS)
  usedFor: Live notification badge and list (BL-050).
- channel: game_post:{postId}
  status: planned
  scope: Per open post
  usedFor: Live status updates (join requests, full, cancelled).
- channel: mini_league:{leagueId}:standings
  status: planned
  scope: Per league
  usedFor: Leaderboard updates after a confirmed result.
- channel: admin:reports
  status: planned
  scope: Admin only
  usedFor: Live report queue for the moderation dashboard.
