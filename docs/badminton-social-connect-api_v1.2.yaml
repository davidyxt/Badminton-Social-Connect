    Suburb:
      type: object
      description: >-
        Australian suburbs and localities with their postcodes. Reference data from GeoNames (CC BY 4.0,
        https://www.geonames.org), loaded from supabase/seeds/production/. Mail-only postcodes (PO boxes,
        large-volume receivers) are excluded. Attribution to GeoNames is required wherever the data is
        shown.
      properties:
        suburb_id:
          type: string
          format: uuid
        name:
          type: string
        postcode:
          type: string
          description: 'Text, not integer: NT and ACT postcodes start with 0.'
        state_code:
          type: string
        latitude:
          type: string
          nullable: true
          description: >-
            Approximate centre of the suburb, not of any person. For distance-based features such as the
            Nearby leaderboard.
        longitude:
          type: string
          nullable: true
    Venue:
      type: object
      description: >-
        Shared reference data. Staff-maintained so players cannot create near-duplicate venues that fragment
        match history.
      properties:
        venue_id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: >-
            The player who last changed this row. Null when the change came from service_role, meaning
            a backend job rather than a person. Set by the venue_set_updated_metadata trigger; a value
            sent by a client is ignored. Not a foreign key, so that player embeds stay unambiguous.
        suburb_id:
          type: string
          format: uuid
          description: >-
            Where the venue is. Find Games shows this suburb to everyone; the venue name and address are
            for accepted players only (PHY-02, BL-017).
        latitude:
          type: string
          nullable: true
          description: >-
            Pin position. The checks keep it inside Australia. Null when the source's pin was wrong; maps_url
            then searches by name and address.
        longitude:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
          description: Where the listing came from, for attribution and corrections.
        coordinates_source:
          type: string
          enum:
          - badmintonhub
          - openstreetmap
          - admin
          nullable: true
          description: >-
            Where the pin came from: badmintonhub (its published venue data), openstreetmap (looked up
            with Nominatim; credit "(c) OpenStreetMap contributors", ODbL) or admin (entered by hand).
        maps_url:
          type: string
          nullable: true
          description: >-
