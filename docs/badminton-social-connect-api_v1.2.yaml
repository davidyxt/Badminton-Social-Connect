          format: uuid
          description: Member (PK, FK to player.playerId).
        joinedAt:
          type: string
          format: date-time
          description: When the player joined the group.
      required:
      - groupId
      - playerId
    GroupMemberCreate:
      type: object
      properties:
        groupId:
          type: string
          format: uuid
          description: Group (PK, FK to group.groupId).
        playerId:
          type: string
          format: uuid
          description: Member (PK, FK to player.playerId).
        joinedAt:
          type: string
          format: date-time
          description: When the player joined the group.
    Venue:
      type: object
      properties:
