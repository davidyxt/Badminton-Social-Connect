      - blockedId
    BlockCreate:
      type: object
      properties:
        blockerId:
          type: string
          format: uuid
          description: Player who created the block (PK, FK).
        blockedId:
          type: string
          format: uuid
          description: Player being blocked (PK, FK).
        createdAt:
          type: string
          format: date-time
          description: When the block was created.
    ActivityLog:
      type: object
      properties:
        logId:
          type: string
          format: uuid
          description: Unique log entry id.
        actorId:
          type: string
          format: uuid
          description: Admin (or system) that performed the action.
        action:
          type: string
          description: Action performed, e.g. suspend_account, hide_post.
        targetType:
          type: string
          description: Type of the affected record, e.g. player, game_post, mini_league.
        targetId:
          type: string
          description: Id of the affected record.
        details:
          type: string
          description: Free-text or JSON-encoded detail of the action.
        createdAt:
          type: string
          format: date-time
          description: When the action was logged.
      required:
      - logId
    AdminPost:
      type: object
      properties:
        adminPostId:
          type: string
          format: uuid
          description: Unique admin post id.
        title:
          type: string
          description: Headline shown on the home page.
        body:
          type: string
          description: Body text (announcement, promo, notice).
        imageUrl:
          type: string
          format: uri
          description: 'Image shown on this carousel card, alongside title/body (Supabase Storage
            public URL). Required to publish (v1.2: the home page carousel is text-and-image, not
            text-only).'
        displayOrder:
          type: integer
          description: Position of this card in the home page carousel (ascending; lower shows first).
            Admin-set; only applied among published items.
        status:
          type: string
          description: draft | published.
        createdBy:
          type: string
          format: uuid
          description: Admin who authored this item (FK to player.playerId).
        publishedAt:
          type: string
          format: date-time
          description: When status last changed to published (null while draft).
      required:
      - adminPostId
    AdminPostCreate:
      type: object
      properties:
        adminPostId:
          type: string
          format: uuid
          description: Unique admin post id.
        title:
          type: string
          description: Headline shown on the home page.
        body:
          type: string
          description: Body text (announcement, promo, notice).
        imageUrl:
          type: string
          format: uri
          description: 'Image shown on this carousel card, alongside title/body (Supabase Storage
            public URL). Required to publish (v1.2: the home page carousel is text-and-image, not
            text-only).'
        displayOrder:
          type: integer
          description: Position of this card in the home page carousel (ascending; lower shows first).
            Admin-set; only applied among published items.
        status:
          type: string
          description: draft | published.
        publishedAt:
          type: string
          format: date-time
          description: When status last changed to published (null while draft).
    AdminPostUpdate:
      type: object
      properties:
        title:
          type: string
          description: Headline shown on the home page.
        body:
          type: string
          description: Body text (announcement, promo, notice).
        imageUrl:
          type: string
          format: uri
          description: 'Image shown on this carousel card, alongside title/body (Supabase Storage
            public URL). Required to publish (v1.2: the home page carousel is text-and-image, not
            text-only).'
        displayOrder:
          type: integer
          description: Position of this card in the home page carousel (ascending; lower shows first).
            Admin-set; only applied among published items.
        status:
          type: string
          description: draft | published.
        publishedAt:
          type: string
          format: date-time
          description: When status last changed to published (null while draft).
    Error:
      type: object
      description: Standard error shape returned to the frontend (see API Specification → Conventions
        in the Technical Design Document).
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. 'forbidden', 'validation_failed', 'not_found'.
        message:
          type: string
          description: Human-readable error message.
      required:
      - code
      - message
  responses:
    Unauthorized:
      description: Missing or invalid session JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The signed-in player is not permitted to perform this action (blocked by Row Level
        Security).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-realtime-channels:
- channel: notifications:{playerId}
  scope: Per player, own row only
  usedFor: Live badge and list updates when a Notification is created or marked read.
- channel: game_post:{postId}
  scope: Per open post
  usedFor: Live status updates (join requests, full, cancelled) for anyone viewing that post.
- channel: mini_league:{leagueId}:standings
  scope: Per league
  usedFor: Leaderboard updates as LeagueStanding rows change after a confirmed result.
- channel: admin:reports
  scope: Admin only
  usedFor: Live report queue for the moderation dashboard.
- channel: admin:activity_log
  scope: Admin only
  usedFor: Live activity log for the moderation dashboard.
