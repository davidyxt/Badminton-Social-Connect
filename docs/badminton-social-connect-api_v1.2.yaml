      tags:
      - Reliability
      summary: Host marks an accepted player as a no-show
      x-implementation: postgres-rpc
      description: |-
        BL-054. Host marks an accepted player absent: supabase.rpc('mark_no_show', { p_post_id, p_player_id }). From the start until 48 hours after the game ends. Notifies the player; counts against reliability. The API spec's matchId parameter is replaced by the game, where attendance belongs.

        **Errors** (`code`: message, safe to show to players):

        - `42501` (not allowed): Only the game's host can record a no-show.
        - `23514` (a rule was broken): This game was cancelled or removed.
        - `23514` (a rule was broken): A no-show can only be recorded once the game has started.
        - `23514` (a rule was broken): No-shows must be recorded within 48 hours of the game.
        - `23514` (a rule was broken): The organiser cannot be marked as a no-show.
        - `23514` (a rule was broken): Only accepted players can be marked as no-shows.
        - `23514` (a rule was broken): This player is not marked as a no-show.
      responses:
        '204':
          description: Done. No body.
        '400':
          "$ref": "#/components/responses/RuleBroken"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_post_id:
                  type: string
                  format: uuid
